<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>랜덤 자리배치</title>
  <link rel="stylesheet" href="seating.css" />
</head>
<body>
  <main class="app student-app">
    <header class="student-header">
      <h1>랜덤 자리배치</h1>
    </header>

    <section class="panel result-panel student-result">
      <div class="board">교탁</div>
      <div id="seatGrid" class="seat-grid student-seat-grid" aria-label="자리표"></div>

      <div class="student-actions">
        <button id="shuffleBtn" class="primary">자리 섞기</button>
        <button id="reshuffleBtn" class="secondary" disabled>다시 섞기</button>
      </div>

      <p id="message" class="message student-message" aria-live="polite"></p>
    </section>
  </main>

  <script src="seating-core.js"></script>
  <script src="seating-student.js"></script>
</body>
</html>
